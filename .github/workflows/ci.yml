name: CI

# TASK-E19-05 AC-2: the MVP's own CI, in Node. There is no Rust here -- the
# package is the visual and behavioural specification, not product code -- so
# the job is `serve` and `verify` chained, which is how the repository tests
# itself in its README.
#
# Actions are pinned by full commit SHA. The umbrella's `check-delivery` gate
# does not reach into this repository (it only reads the umbrella's own
# `.github/workflows`), but the rule is the umbrella's and AGENTS.md 1.2
# applies to every repository in the family: a floating tag is an unreviewed
# dependency.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    # `windows-2022`, not a Linux runner, because `out/` is an artifact of this
    # platform and `verify` is a byte-for-byte comparison against it. The
    # extraction reads *computed* style and *measured* geometry through Chrome, so
    # anything the text metrics feed lands in the output -- and the fonts differ by
    # OS. This is not a theory: on ubuntu-22.04 the job failed deterministically,
    # twice, on exactly five files -- `#graph-minimap` in two states plus
    # `index.json` -- while four full local runs on the freezing host compared 499
    # files with 0 differing.
    #
    # The mechanism is in `mvp/graph-editor.js`. `drawMini()` decides visibility
    # with `b.right*scale+v.x > r.width` and writes `r.width/v.scale` and
    # `r.height/v.scale` into the minimap, where `r` is the *measured* viewport
    # rect. The graph viewport is `flex:1` under a text-sized header, so its height
    # follows the font metrics; measured here, swapping the font family moved it
    # from 568.3px to 567.3px. One pixel is enough to flip `overflow` at a
    # different point in the click sweep, and `drawMini` leaves the previous
    # state's children in place when it hides the element, so the two hosts keep
    # different stale content. `mvp/` is the frozen spec and is not ours to edit
    # for this; matching the platform is the fix.
    #
    # The reference environment has been Windows since the freeze (README: rev.37
    # extracted on Windows 11, Chrome 156, Node 24), and `out/` carries that host's
    # Segoe UI metrics. Pinning the runner to the same family is what makes this
    # job measure the spec instead of the runner image. A macOS or Linux runner
    # would need `out/` re-frozen on it -- a different decision, for a maintainer.
    runs-on: windows-2022
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 20
          cache: npm
      # `npm ci` and not `npm install`: the lockfile is the input, and a job
      # that silently resolves a newer playwright is not testing this commit.
      - run: npm ci
      # resvg is deliberately NOT installed. It is the renderer `check-svg`
      # compares Chrome against, and `check-svg` is not a step here (see the note
      # at the end of this file), so `cargo install resvg` bought 33 seconds of
      # nothing. The README still requires it for a maintainer running
      # `check-svg` locally.
      #
      # Chrome, not Playwright's bundled chromium. `extract.cjs` launches with
      # `channel: 'chrome'` unless `CHROME` points elsewhere, and the Windows
      # image ships Google Chrome -- so downloading a second browser both wastes
      # a minute and, as it ran on the Linux image, produced
      # `spawn .../chromium-1248 EACCES` and failed `verify` before it started.
      # Playwright is a Node dependency and arrives with `npm ci`; only its
      # browser was ever missing, and it is not used. The version is printed so a
      # runner image change is visible in the log.
      # The version is read from the file, not from `chrome.exe --version`: Chrome
      # is a GUI-subsystem binary on Windows, so it neither writes to the console
      # nor returns -- run 42654628242 sat in this step for 30 minutes with no
      # output at all. Reading `VersionInfo` proves the browser is there in a
      # second, and that is all this step is for.
      - name: Chrome
        shell: pwsh
        run: |
          $chrome = Join-Path $env:ProgramFiles 'Google\Chrome\Application\chrome.exe'
          if (-not (Test-Path $chrome)) { throw "Chrome not found at $chrome" }
          "chrome $((Get-Item $chrome).VersionInfo.ProductVersion)"
      # The server is started detached and polled, not slept on: a fixed sleep
      # is the classic flake, and `verify` re-extracts the whole MVP through it,
      # so the page must be answering before the first navigation.
      - name: Serve and verify, chained
        run: |
          set -eu
          node tools/serve.cjs mvp 8766 &
          server=$!
          trap 'kill $server 2>/dev/null || true' EXIT
          for _ in $(seq 1 60); do
            if curl -sf -o /dev/null http://127.0.0.1:8766/index.html; then break; fi
            sleep 1
          done
          curl -sf -o /dev/null http://127.0.0.1:8766/index.html
          npm run verify
      # `check-svg` is deliberately NOT a step here, and the reason is the report,
      # not the tool. AC-2 asks for `serve` and `verify`, both above. `check-svg`
      # now takes `--check` and exits non-zero on a failing file, so it could be a
      # gate -- but `out/check/report.json` lists 6 files that fail today: one
      # `empty` (no ink in either renderer), one `pathLength` and four `blurFn`,
      # the last five of which are renderer gaps the native loader is specified to
      # fix. They are evidence awaiting the font and loader tasks, not a
      # regression. Adding the step now would make every PR red on purpose, and
      # adding it without `--check` would be a green that proves nothing. The step
      # joins when those six are explained.
