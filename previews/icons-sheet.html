<!doctype html><html lang="pt-BR"><meta charset="utf-8"><title>Vynamp — ícones</title>
<style>body{background:#101317;color:#d8dde3;font:12px system-ui;margin:16px}main{display:grid;grid-template-columns:repeat(auto-fill,96px);gap:10px}figure{margin:0;background:#1a1f26;border-radius:8px;padding:8px;text-align:center}.icon{fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}.b .icon{width:48px;height:48px;color:#9fe870}.s .icon{width:18px;height:18px}figcaption{margin-top:4px;opacity:.7;font-size:11px}</style>
<h1>Ícones Vynamp (icons.js)</h1><main id="sheet"></main>
<script src="../icons.js"></script>
<script>sheet.innerHTML=VynampIcons.names.map(n=>'<figure><div class=b>'+VynampIcons.svg(n)+'</div><div class=s>'+VynampIcons.svg(n)+'</div><figcaption>'+n+'</figcaption></figure>').join('');</script>
